# 把下面这段贴进 `server_name keleshiyizhimao.com` 那个 server 块里。
# 不要贴进 feileme.keleshiyizhimao.com 的 server 块——那个块整站 301 跳到 apex，
# 板端 disable_auto_redirect=true，收到 301 就会直接显示"路线查询失败"。

# ---------------------------------------------------------------------------
# 板端唯一的入口。必须是精确匹配（=），避免被 location / 吃掉，
# 也避免 /api/route-card/ 这种尾斜杠触发 nginx 的自动 301。
# ---------------------------------------------------------------------------
location = /api/route-card {
    proxy_pass http://127.0.0.1:8010;

    # 板端一次 GET 读完就关连接：给它明确的 Content-Length，别用分块传输。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 响应很小（实测 251 字节），压缩只会让固件多一层解压，直接关掉。
    gzip off;

    # 不让 nginx 改写 Location；上游也不该发 3xx。
    proxy_redirect off;

    # 上游自己保证 3 秒内回腾讯超时结果、8 秒内返回。
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# ---------------------------------------------------------------------------
# Agent 调用的 Connector 入口（MCP，JSON-RPC）
# ---------------------------------------------------------------------------
location = /mcp {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Agent 平台的 sessionId / callId 走什么头我们现在还不知道，
    # 这里必须原样透传，不要加任何过滤或改写。
    proxy_pass_request_headers on;

    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;      # 查一次腾讯约 1-2 秒，留足余量
    proxy_buffering off;         # 工具调用是需要即时响应的请求
}

# ---------------------------------------------------------------------------
# 健康检查：验收脚本要打它，也方便你随时确认服务活着
# ---------------------------------------------------------------------------
location = /health {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

# ---------------------------------------------------------------------------
# 调试接口：只允许本机（ssh 上去用 curl 127.0.0.1 访问），不对外暴露。
# 里面能看到会话表、卡内容、以及 Agent 传过来的原始请求体——排查"sessionId 到底
# 在哪个字段"就靠它。
# ---------------------------------------------------------------------------
location ^~ /api/admin/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# 改完务必：
#   sudo nginx -t && sudo systemctl reload nginx
# nginx -t 不过就不要 reload，现有 CloudMood 不受影响。
